name: Go and Staticcheck
description: Set up the caller's Go version and checksum-verified Staticcheck build
inputs:
  go-version-file:
    description: Path to the caller's go.mod, relative to its checkout
    required: false
    default: go.mod
  cache:
    description: Enable setup-go's Go cache; disable when the caller owns it
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: ${{ inputs.go-version-file }}
    - name: Assert Go and identify the Staticcheck build
      id: build
      shell: bash
      env:
        GO_VERSION_FILE: ${{ inputs.go-version-file }}
      run: |
        set -euo pipefail
        expected="go$(awk '$1 == "go" {print $2}' "$GITHUB_WORKSPACE/$GO_VERSION_FILE")"
        go version
        test "$(go env GOVERSION)" = "$expected"
        # Hash all build pins and the recipe, so no changed patch can reuse a binary.
        recipe=$(sha256sum "$GITHUB_ACTION_PATH/action.yml" | cut -d ' ' -f 1)
        echo "key=lictor-staticcheck-${RUNNER_OS}-${RUNNER_ARCH}-${expected}-${recipe}" >> "$GITHUB_OUTPUT"
        echo "bin=$RUNNER_TEMP/lictor-staticcheck/bin" >> "$GITHUB_OUTPUT"
    - name: Cache Staticcheck
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.build.outputs.bin }}
        key: ${{ steps.build.outputs.key }}
    - name: Build Staticcheck from verified source
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        STATICCHECK_BIN: ${{ steps.build.outputs.bin }}
        STATICCHECK_TAG: "2026.2.2"
        STATICCHECK_SOURCE_SHA256: f957eca5ee25bba46711433bfc320e0e900304ebb89641264bde256031926139
      run: |
        set -euo pipefail
        src=$(mktemp -d "$RUNNER_TEMP/staticcheck-src.XXXXXX")
        trap 'rm -rf "$src"' EXIT
        mkdir -p "$STATICCHECK_BIN"
        curl -fsSL -o "$src/src.tar.gz" "https://github.com/dominikh/go-tools/archive/refs/tags/${STATICCHECK_TAG}.tar.gz"
        printf '%s  %s\n' "$STATICCHECK_SOURCE_SHA256" "$src/src.tar.gz" | sha256sum -c -
        tar -xzf "$src/src.tar.gz" -C "$src"
        (cd "$src/go-tools-${STATICCHECK_TAG}" && go build -trimpath -o "$STATICCHECK_BIN/staticcheck" ./cmd/staticcheck)
    - name: Assert Staticcheck and add it to PATH
      shell: bash
      env:
        STATICCHECK_BIN: ${{ steps.build.outputs.bin }}
      run: |
        set -euo pipefail
        "$STATICCHECK_BIN/staticcheck" --version
        test "$("$STATICCHECK_BIN/staticcheck" --version)" = 'staticcheck 2026.2.2 (0.8.2)'
        echo "$STATICCHECK_BIN" >> "$GITHUB_PATH"
