name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Verify annotated tag, source version and tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" = tag
          test "$(go run ./cmd/lictor version --json | jq -r .version)" = "${RELEASE_TAG}"
          make test
      - name: Build reproducible release archives
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          version="${RELEASE_TAG#v}"
          mkdir -p dist .cache/release
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage=".cache/release/${os}-${arch}"
            mkdir -p "${stage}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" \
              go build -trimpath -buildvcs=true -ldflags="-s -w" \
              -o "${stage}/lictor" ./cmd/lictor
            tar --sort=name --mtime="@${source_date_epoch}" \
              --owner=0 --group=0 --numeric-owner \
              -C "${stage}" -cf - lictor | gzip -n > "dist/lictor_${version}_${os}_${arch}.tar.gz"
          done
          (cd dist && sha256sum lictor_*.tar.gz > checksums.txt)
          (cd dist && sha256sum --check checksums.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${RELEASE_TAG}" dist/* --verify-tag \
            --title "Lictor ${RELEASE_TAG}" --notes-file RELEASE_NOTES.md
